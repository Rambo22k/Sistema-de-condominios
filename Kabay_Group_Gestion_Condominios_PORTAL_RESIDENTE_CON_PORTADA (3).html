/* Rediseño visual profesional Kabay Group */
:root{
 --green:#187f83;--green2:#e7f2f3;--ink:#1d2b3a;--muted:#718096;

body{background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif}

 background:#fff;border-bottom:1px solid #dce4ec;height:72px;padding:0 30px;

.sidefoot{border-color:#31465e;color:#a6b5c5;line-height:1.6}

.heading{margin-bottom:25px}

.hero{

function openPortalUserForm(){let units=db.units.map(u=>({id:u.id,label:u.numero+' · '+(db.buildings.find(b=>b.id===u.building)?.nombre||'Edificio')}));document.getElementById('overlay').innerHTML=`<div class="modalback" data-close><section class="modal"><div class="modalHead"><b>Registrar usuario residente</b><button class="btn" type="button" data-close aria-label="Cerrar">×</button></div><form id="portalUserForm" class="modalBody"><div class="formgrid"><label>Nombre completo<input class="field" name="nombre" autocomplete="name" required></label><label>Correo electrónico<input class="field" name="correo" type="email" autocomplete="email" required></label><label>Contraseña inicial<input class="field" name="password" type="password" minlength="8" autocomplete="new-password" required><small class="formhint">Usa al menos 8 caracteres.</small></label><label>Tipo de residente<select name="tipo" required><option>Propietario</option><option>Inquilino</option><option selected>Residente autorizado</option></select></label><label class="full">Unidad (opcional)<select name="unit"><option value="">Asignar más tarde</option>${units.map(u=>`<option value="${esc(u.id)}">${esc(u.label)}</option>`).join('')}</select><small class="formhint">Si asignas una unidad, el residente la verá en su portal.</small></label><label class="full">Relación con la unidad<select name="rol"><option>Propietario</option><option>Inquilino</option><option selected>Residente autorizado</option></select></label></div><div class="notice">No se envía un correo automático. Comparte la contraseña inicial de forma privada.</div><div class="modalFoot"><button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="submit">Crear acceso</button></div></form></section></div>`}function billing(){return heading('Generación de facturación mensual','Genera cargos desde cuotas activas para las unidades registradas.',btn('Generar facturación','add',true))+`<div class="panel empty">Se crearán facturas para cada apartamento y cuota activa. Facturas existentes: ${db.invoices.length}</div>`}
function receivables(){let pending=db.invoices.filter(x=>x.status!=='Pagada');return records('Cuentas por cobrar y estados de cuenta','Saldos agrupados por apartamento.',pending,['Unidad','Facturas pendientes','Saldo'],u=>{let a=pending.filter(x=>x.unit===u.unit);return `<tr><td>${esc(u.unidad)}</td><td>${a.length}</td><td>${money(a.reduce((s,x)=>s+Number(x.monto),0))}</td></tr>`})}
function depositAdmin(){let rows=db.deposits.map(x=>{let unit=db.units.find(u=>u.numero===x.unidad||u.id===x.unit),person=db.people.find(p=>p.correo===x.person);return `<tr><td>${esc(x.unidad||unit?.numero||'—')}</td><td>${esc(x.edificio||'—')}</td><td>${esc(x.payerName||person?.nombre||x.person||'—')}</td><td>${esc(x.banco||'—')}</td><td>${esc(x.fecha||'—')}</td><td>${money(x.monto)}</td><td>${esc(x.tipoPago||'—')}</td><td>${esc(x.referencia||'—')}</td><td>${x.comprobante?`<a href="${x.comprobante}" target="_blank" rel="noopener">Ver comprobante</a>`:'—'}</td><td><span class="badge ${x.status==='Aprobado'?'':x.status==='Rechazado'?'warn':'warn'}">${esc(x.status)}</span></td><td>${x.status==='Reportado'||x.status==='En revisión'?`<button class="smallbtn" data-deposit-status="Aprobado" data-deposit="${x.id}">Aprobar</button> <button class="smallbtn" data-deposit-status="Rechazado" data-deposit="${x.id}">Rechazar</button>`:'—'}</td></tr>`}).join('');return heading('Reporte y validación de depósitos','Revisa el comprobante, identifica quién realizó el pago y aprueba o rechaza cada reporte.',stat('Reportados',db.deposits.filter(x=>['Reportado','En revisión'].includes(x.status)).length)+stat('Aprobados',db.deposits.filter(x=>x.status==='Aprobado').length)+stat('Rechazados',db.deposits.filter(x=>x.status==='Rechazado').length))+`<section class="panel">${table(['Unidad','Edificio','Pagador','Banco','Fecha','Monto','Tipo de pago','Referencia','Comprobante','Estado','Validación'],rows)}</section>`}
function reconcile(){return heading('Conciliación bancaria','Registra movimientos del extracto y compáralos por referencia e importe.',btn('+ Añadir movimiento bancario','add',true))+`<section class="panel"><div class="panelHead"><div><h2>Movimientos bancarios</h2><p>Concilia cuando coincidan referencia y monto.</p></div></div>${table(['Fecha','Referencia','Descripción','Monto','Estado','Acción'],db.bank.map(b=>{let d=db.deposits.find(x=>x.referencia===b.referencia&&Number(x.monto)===Number(b.monto));return `<tr><td>${esc(b.fecha)}</td><td>${esc(b.referencia)}</td><td>${esc(b.descripcion)}</td><td>${money(b.monto)}</td><td>${b.status==='Conciliado'?'Conciliado':d?'Coincidencia':'Pendiente'}</td><td>${d&&b.status!=='Conciliado'?`<button class="smallbtn" data-match="${b.id}">Conciliar</button>`:'—'}</td></tr>`}).join(''))}</section><section class="panel"><div class="panelHead"><div><h2>Depósitos reportados</h2></div></div>${table(['Unidad','Referencia','Monto','Estado'],db.deposits.map(d=>`<tr><td>${esc(d.unidad)}</td><td>${esc(d.referencia)}</td><td>${money(d.monto)}</td><td>${esc(d.status)}</td></tr>`).join(''))}</section>`}
function tickets(){return heading('Gestión de quejas, solicitudes e incidencias','Asigna responsables y actualiza el seguimiento.',btn('+ Nuevo caso','add',true))+`<section class="panel"><div class="panelHead"><div><h2>Bandeja de casos</h2><p>Casos creados desde administración y portal residente.</p></div></div>${table(['Tipo','Asunto','Unidad','Responsable','Estado','Acciones'],db.tickets.map(t=>`<tr><td>${esc(t.tipo)}</td><td>${esc(t.asunto)}</td><td>${esc(t.unidad)}</td><td><input class="field" data-assignee="${t.id}" value="${esc(t.responsable||'')}" placeholder="Asignar"></td><td><select data-status="${t.id}">${['Abierta','En revisión','En progreso','Resuelta','Cerrada'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`)}</select></td><td>${actions(t.id)}</td></tr>`).join(''))}</section>`}

function payersPage(){let rows=db.payers.map(x=>{let unit=db.units.find(u=>u.id===x.unit),person=db.people.find(p=>p.id===x.person),group=db.payers.filter(p=>p.unit===x.unit&&(!p.hasta||p.hasta>=new Date().toISOString().slice(0,10)));let total=group.reduce((a,p)=>a+Number(p.porcentaje||0),0);return `<tr><td>${esc(unit?.numero||'—')}</td><td>${esc(person?.nombre||'—')}</td><td>${esc(x.tipo_responsabilidad||'—')}</td><td>${Number(x.porcentaje||0)}%</td><td>${esc(x.desde||'—')}</td><td>${esc(x.hasta||'Sin fecha final')}</td><td><span class="badge ${total===100?'':'warn'}">${total}% asignado</span></td><td>${actions(x.id)}</td></tr>`}).join('');return heading('Responsables de pago por apartamento','Asigna uno o varios responsables y define qué porcentaje corresponde a cada persona.',btn('+ Asignar responsable','add',true))+`<div class="helper">Regla: un responsable principal cubre el 100 %. Si el pago es compartido, los porcentajes de las personas activas deben sumar exactamente el 100 % para poder facturar.</div><section class="panel">${table(['Apartamento','Responsable','Tipo','Porcentaje','Desde','Hasta','Distribución','Acciones'],rows)}</section>`}
function tariffsPage(){let rows=db.tariffs.map(x=>`<tr><td>${esc(db.units.find(u=>u.id===x.unit)?.numero||'—')}</td><td>${money(x.monto)}</td><td>${esc(x.dia||'10')}</td><td>${esc(x.desde||'—')}</td><td>${esc(x.hasta||'Vigente')}</td><td>${esc(db.people.find(p=>p.id===db.payers.find(z=>z.unit===x.unit)?.person)?.nombre||'Según responsables')}</td><td>${actions(x.id)}</td></tr>`).join('');return heading('Tarifario de pago de vivienda','Consulta las tarifas actuales y conserva el historial de cambios por apartamento.',btn('+ Registrar tarifa','add',true))+`<div class="helper">Al registrar una nueva tarifa para un apartamento, la tarifa anterior se cierra el día previo a la nueva vigencia. Así se conserva el historial sin duplicar períodos.</div><section class="panel">${table(['Apartamento','Tarifa mensual','Día límite','Desde','Hasta','Responsable','Acciones'],rows)}</section>`}
function servicesPage(){let rows=db.services.map(x=>`<tr><td>${esc(db.units.find(u=>u.id===x.unit)?.numero||'Todas las unidades del conjunto')}</td><td>${esc(x.servicio)}</td><td>${esc(x.metodo||'Monto fijo')}</td><td>${money(x.monto||0)}${x.tarifa_unidad?` · ${money(x.tarifa_unidad)}/unidad`:''}</td><td>${esc(x.frecuencia)}</td><td><span class="badge ${x.estado==='Inactivo'?'warn':''}">${esc(x.estado)}</span></td><td>${actions(x.id)}</td></tr>`).join('');let readings=db.serviceReadings||[];return heading('Servicios, consumos y cargos','Administra electricidad, agua y mantenimiento, registra lecturas y calcula los cargos.',btn('+ Configurar servicio','add',true))+`<div class="helper">Para electricidad y agua puedes registrar lecturas anteriores y actuales. El sistema calcula el consumo y el importe según la tarifa por unidad. Los servicios distribuidos se reparten entre los apartamentos activos del mismo condominio.</div><section class="panel"><div class="panelHead"><div><h2>Servicios configurados</h2><p>Reglas de cobro por apartamento o conjunto.</p></div><button class="btn primary" data-act="reading">＋ Registrar lectura</button></div>${table(['Apartamento / alcance','Servicio','Cálculo','Tarifa','Frecuencia','Estado','Acciones'],rows)}</section><section class="panel"><div class="panelHead"><div><h2>Lecturas y consumos registrados</h2><p>El importe calculado queda disponible para la próxima facturación.</p></div></div>${table(['Período','Apartamento','Servicio','Lectura anterior','Lectura actual','Consumo','Importe','Estado'],readings.map(r=>`<tr><td>${esc(r.periodo)}</td><td>${esc(db.units.find(u=>u.id===r.unit)?.numero||'—')}</td><td>${esc(db.services.find(v=>v.id===r.service)?.servicio||'—')}</td><td>${r.anterior}</td><td>${r.actual}</td><td>${Number(r.consumo).toLocaleString('es-DO')}</td><td>${money(r.importe)}</td><td><span class="badge">${esc(r.status||'Pendiente')}</span></td></tr>`).join(''))}</section>`}

function announcementsPage(){
 const all=[...db.announcements];
 const total=all.length, recipients=all.reduce((n,a)=>n+Number(a.total||0),0);
 const today=new Date().toISOString().slice(0,10);
 const active=all.filter(a=>!a.expiracion||a.expiracion>=today).length;
 const cards=all.map(a=>{const type=a.tipo||'Aviso general';const tone=type.includes('Emergencia')?'urgent':type.includes('Interrupción')?'service':type.includes('Actividad')||type.includes('Convocatoria')?'event':'general';const msg=String(a.mensaje||'');const condo=a.condo==='all'||!a.condo?'Todos los condominios':(db.condos.find(c=>c.id===a.condo)?.nombre||'Condominio');return `<article class="announcement-card" data-ann-card><div class="announcement-card-top"><span class="announcement-type ${tone}">${esc(type)}</span><span class="announcement-status">${esc(a.estado||'Publicado localmente')}</span></div><h3>${esc(a.titulo||'Aviso sin título')}</h3><p class="announcement-preview">${esc(msg.length>210?msg.slice(0,207)+'…':msg||'Sin descripción')}</p><div class="announcement-meta"><span>◷ ${esc(a.publicacion||a.fecha||'Fecha no indicada')}</span><span>⌂ ${esc(condo)}</span><span>♙ ${Number(a.total||0)} destinatarios</span></div><div class="announcement-card-bottom"><small>Publicado: ${esc(a.fecha||'—')}${a.expiracion?' · Hasta '+esc(a.expiracion):''}</small><button class="btn announcement-detail" data-announcement="${a.id}">Ver detalle <span>→</span></button></div></article>`}).join('');
 return heading('Avisos y actividades','Comunica novedades, actividades e información importante a los residentes.',btn('+ Crear aviso','add',true))+`<section class="announcement-intro"><div class="announcement-intro-icon">✉</div><div><span class="eyebrow">CENTRO DE COMUNICACIONES</span><h2>Mantén informada a tu comunidad</h2><p>Organiza los comunicados por tipo, consulta su alcance y revisa los destinatarios registrados.</p></div></section><div class="announcement-stats"><div><span>Avisos publicados</span><strong>${total}</strong><small>Comunicaciones registradas</small></div><div><span>Destinatarios registrados</span><strong>${recipients}</strong><small>Asignaciones por aviso</small></div><div><span>Vigentes</span><strong>${active}</strong><small>Sin fecha de expiración vencida</small></div></div><div class="announcement-notice"><span>ⓘ</span><p><b>Información sobre las comunicaciones:</b> los avisos se guardan localmente y se muestran en el portal según sus destinatarios. No se envían correos, SMS ni notificaciones externas desde esta demostración.</p></div><div class="announcement-list-head"><div><h2>Historial de comunicaciones</h2><p>Consulta y revisa los avisos registrados.</p></div><label class="announcement-search">⌕ <input id="announcementSearch" type="search" placeholder="Buscar por título, tipo o mensaje..."></label></div>${cards?`<div class="announcement-grid" id="announcementGrid">${cards}</div>`:`<div class="announcement-empty"><div class="announcement-empty-icon">✉</div><h3>Aún no hay avisos publicados</h3><p>Cuando registres una comunicación, aparecerá aquí con su alcance y destinatarios.</p><button class="btn primary" data-act="add">＋ Crear primer aviso</button></div>`}`
}

function avatarMarkup(item,cls=''){let name=item?.reporterName||'Residente';let initials=name.trim().split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()||'').join('')||'R';return `<div class="profile-avatar ${cls}">${item?.avatar?`<img src="${item.avatar}" alt="Foto de ${esc(name)}">`:esc(initials)}</div>`}
function profileEditor(item){let person=db.people.find(p=>p.id===item?.reporter);let name=item?.reporterName||person?.nombre||'Residente';return `<div class="complaint-profile"><div id="complaintAvatarPreview">${avatarMarkup({...item,reporterName:name})}</div><div class="profile-meta"><strong id="complaintProfileName">${esc(name)}</strong><span>Foto de perfil del residente. El sistema genera un avatar inicial automáticamente; puedes reemplazarlo por una fotografía.</span><div class="profile-actions"><label class="profile-upload">▧ Cambiar foto<input id="complaintPhoto" type="file" accept="image/png,image/jpeg,image/webp"></label><button type="button" class="smallbtn" id="removeComplaintPhoto">Restablecer avatar</button></div></div><input type="hidden" name="avatar" value="${esc(item?.avatar||'')}"></div>`}
function bindProfilePreview(formEl){let resident=formEl.querySelector('[name=reporter]'),file=formEl.querySelector('#complaintPhoto'),hidden=formEl.querySelector('[name=avatar]'),preview=formEl.querySelector('#complaintAvatarPreview'),nameEl=formEl.querySelector('#complaintProfileName');const updateName=()=>{let person=db.people.find(p=>p.id===resident?.value),name=person?.nombre||'Residente';nameEl.textContent=name;if(!hidden.value)preview.innerHTML=avatarMarkup({reporterName:name})};resident?.addEventListener('change',updateName);file?.addEventListener('change',()=>{let f=file.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){notify('Selecciona una imagen válida.');file.value='';return}if(f.size>8*1024*1024){notify('La imagen debe pesar menos de 8 MB.');file.value='';return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let canvas=document.createElement('canvas'),scale=Math.min(1,320/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.82);hidden.value=data;preview.innerHTML=`<div class="profile-avatar"><img src="${data}" alt="Vista previa de la foto"></div>`};img.src=reader.result};reader.readAsDataURL(f)});formEl.querySelector('#removeComplaintPhoto')?.addEventListener('click',()=>{hidden.value='';file.value='';updateName();notify('Se restauró el avatar generado por el sistema.')})}
function complaintGroup(status){if(['Resuelta','Cerrada'].includes(status))return 'Resueltas';if(status==='En revisión')return 'En revisión';return 'Pendientes'}
function nextComplaintRef(){let year=new Date().getFullYear(),used=db.tickets.filter(t=>t.tipo==='Queja').map(t=>Number(String(t.referencia||'').split('-').pop())||0);return `QUE-${year}-${String(Math.max(0,...used)+1).padStart(4,'0')}`}
function complaintsPage(){let cases=db.tickets.filter(t=>t.tipo==='Queja');let changed=false;cases.forEach((t,i)=>{if(!t.referencia){let y=String(t.fecha||'').match(/\b(20\d{2})\b/)?.[1]||new Date().getFullYear();t.referencia=`QUE-${y}-${String(i+1).padStart(4,'0')}`;changed=true}});if(changed)save();let counts={Total:cases.length,Pendientes:cases.filter(t=>complaintGroup(t.status||'Abierta')==='Pendientes').length,'En revisión':cases.filter(t=>complaintGroup(t.status)==='En revisión').length,Resueltas:cases.filter(t=>complaintGroup(t.status)==='Resueltas').length};let visible=complaintStatusFilter==='Todas'?cases:cases.filter(t=>complaintGroup(t.status||'Abierta')===complaintStatusFilter);let cards=visible.map(t=>{let person=db.people.find(p=>p.id===t.reporter);let displayName=t.reporterName||person?.nombre||'Residente';let item={...t,reporterName:displayName};return `<article class="complaint-card"><div class="complaint-ref-row"><span class="complaint-ref-label">IDENTIFICADOR DE QUEJA</span><strong class="complaint-ref">${esc(t.referencia)}</strong></div><div class="complaint-card-top">${avatarMarkup(item)}<div class="complaint-card-title"><strong>${esc(displayName)}</strong><small>${esc(t.fecha||'Fecha no disponible')} · Apartamento ${esc(t.unidad||'—')}</small></div><span class="badge ${t.status==='Abierta'?'warn':''}">${esc(t.status||'Abierta')}</span></div><p><b>${esc(t.asunto)}</b><br>${esc(t.descripcion||'Sin descripción')}</p><div class="complaint-card-foot"><div class="complaint-tags"><span class="badge ${t.prioridad==='Urgente'?'red':t.prioridad==='Alta'?'warn':''}">${esc(t.prioridad||'Normal')}</span><span class="hint">${esc(t.responsable||'Sin asignar')}</span></div><div class="actions"><button class="smallbtn" data-case="${t.id}">Gestionar</button><button class="smallbtn" data-del="${t.id}">Eliminar</button></div></div></article>`}).join('');let statCard=(label,value,key)=>`<button type="button" class="stat complaint-stat ${complaintStatusFilter===key?'selected':''}" data-complaint-filter="${key}"><span>${label}</span><strong>${value}</strong><small>${key==='Todas'?'Ver todas las quejas':'Filtrar listado'}</small></button>`;return heading('Quejas de residentes','Cada queja muestra el perfil del residente, su apartamento y el seguimiento administrativo.',btn('+ Registrar queja','add',true))+`<div class="stats">${statCard('Total de quejas',counts.Total,'Todas')}${statCard('Pendientes',counts.Pendientes,'Pendientes')}${statCard('En revisión',counts['En revisión'],'En revisión')}${statCard('Resueltas',counts.Resueltas,'Resueltas')}</div><div class="complaint-list-heading"><div><b>${complaintStatusFilter==='Todas'?'Todas las quejas':complaintStatusFilter}</b><span>${visible.length} ${visible.length===1?'registro':'registros'}</span></div>${complaintStatusFilter!=='Todas'?'<button class="smallbtn" data-complaint-filter="Todas">Quitar filtro ×</button>':''}</div>${cards?`<div class="complaint-grid">${cards}</div>`:`<div class="complaint-empty"><div style="font-size:30px;margin-bottom:9px">✦</div><b>${cases.length?'No hay quejas en esta categoría':'Todavía no hay quejas registradas'}</b><p>${cases.length?'Selecciona otra tarjeta para consultar los demás estados.':'Cuando un residente presente una queja, su perfil aparecerá aquí con su fotografía o avatar.'}</p></div>`}`}


function caseDetail(idCase){let t=db.tickets.find(x=>x.id===idCase);if(!t)return;let person=db.people.find(p=>p.id===t.reporter);t.reporterName=t.reporterName||person?.nombre||'Residente';document.getElementById('overlay').innerHTML=`<div class="modalback" data-close><section class="modal"><div class="modalHead"><b>Seguimiento de queja · ${esc(t.referencia||'Sin identificador')}</b><button class="btn" data-close>×</button></div><div class="modalBody">${profileEditor(t)}<div style="padding:8px 2px"><p><b>${esc(t.asunto)}</b></p><p>${esc(t.descripcion||'')}</p><p>Apartamento: ${esc(t.unidad||'—')} · Estado: ${esc(t.status||'Abierta')}</p></div><label style="display:grid;gap:6px;margin:12px 0">Responsable asignado<input id="caseAssignee" class="field" value="${esc(t.responsable||'')}" placeholder="Nombre del responsable"></label><label style="display:grid;gap:6px;margin:12px 0">Respuesta de administración<textarea id="caseReply" rows="4">${esc(t.respuesta||'')}</textarea></label><label style="display:grid;gap:6px;margin:12px 0">Estado<select id="caseStatus">${['Abierta','En revisión','En progreso','Resuelta','Cerrada'].map(v=>`<option ${t.status===v?'selected':''}>${v}</option>`).join('')}</select></label><div class="modalFoot"><button class="btn primary" data-savecase="${t.id}">Guardar seguimiento</button></div></div></section></div>`;let editor=document.querySelector('#overlay .modalBody');bindProfilePreview(editor);let resident=editor.querySelector('[name=reporter]');if(resident)resident.value=t.reporter||''}

  overlay.innerHTML=''; editingId=null; e.stopPropagation(); return;

function downloadBackup(){
 const payload={application:'Kabay Group · Gestión de condominios',formatVersion:2,exportedAt:new Date().toISOString(),data:db};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='kabay-group-respaldo-'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
 notify('Copia de seguridad descargada.');
}

function restoreBackup(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const parsed=JSON.parse(String(reader.result||''));
   const incoming=parsed.data&&typeof parsed.data==='object'?parsed.data:parsed;
   const required=Object.keys(seed());
   if(!incoming||typeof incoming!=='object'||!required.some(k=>Array.isArray(incoming[k]))){notify('El archivo no parece ser una copia de Kabay Group.');return}
   if(!confirm('Restaurar esta copia reemplazará los datos actuales guardados en este navegador. ¿Deseas continuar?'))return;
   const clean=seed();
   for(const k of required){if(Array.isArray(clean[k]))clean[k]=Array.isArray(incoming[k])?incoming[k]:[];else clean[k]=incoming[k]??clean[k]}
   db=clean;save();page='dashboard';filter='';render();notify('Copia restaurada correctamente.');
  }catch(err){notify('No se pudo leer el archivo. Comprueba que sea un JSON válido.')}
 };
 reader.readAsText(file);
}
