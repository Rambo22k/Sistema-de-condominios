/* Perfil visual de quien registra una queja */
.complaint-profile{display:flex;align-items:center;gap:14px;padding:15px 18px;margin:0 18px 4px;background:linear-gradient(135deg,#f1f8f5,#fbfdfc);border:1px solid #e0ece6;border-radius:13px}

/* Kabay UX upgrade */
.topbar{gap:14px}.topright{gap:9px}.global-tools{display:flex;align-items:center;gap:8px;min-width:0}

/* Rediseño visual profesional Kabay Group */
:root{
 --green:#187f83;--green2:#e7f2f3;--ink:#1d2b3a;--muted:#718096;
 --line:#dce4ec;--bg:#f3f6fa;--white:#fff;--amber:#a66b18;--red:#b54747;
}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif}
.topbar{
 background:#fff;border-bottom:1px solid #dce4ec;height:72px;padding:0 30px;
 box-shadow:0 2px 10px rgba(20,38,61,.035)
}
.brand{gap:13px;color:#172b43;font-size:14px;letter-spacing:-.01em}
.logo{
 width:40px;height:40px;border-radius:11px;
 background:linear-gradient(145deg,#173653,#187f83);
 box-shadow:0 4px 10px rgba(24,79,111,.18);font-size:20px
}
.topright{color:#65758a;font-size:12px}
.avatar{background:#e8eef5;color:#233e59;border:1px solid #dce5ee}
.layout{min-height:calc(100vh - 72px)}
aside{
 width:258px;background:#172b43;border-right:0;padding:20px 13px;
 box-shadow:4px 0 18px rgba(17,39,62,.06)
}
.navtitle{color:#91a5ba;padding:17px 12px 8px;font-size:9px;letter-spacing:.13em;font-weight:750}
.nav button{
 color:#d1dbe6;border-radius:8px;padding:10px 12px;font-size:12px;
 transition:background .18s ease,color .18s ease,transform .18s ease
}
.nav button:hover{background:#223d5b;color:#fff;transform:translateX(2px)}
.nav button.active{
 background:#254765;color:#fff;font-weight:700;
 box-shadow:inset 3px 0 #42b5b0
}
.nav .ico{color:#83b9bd;width:27px}
.nav button.active .ico{color:#75d0ca}
.sidefoot{border-color:#31465e;color:#a6b5c5;line-height:1.6}
.main{padding:30px clamp(18px,3vw,48px);max-width:1680px}
.crumb{color:#8290a2;font-size:11px;letter-spacing:.015em}
.heading{margin-bottom:25px}
.heading h1{font-size:28px;color:#1b2d42;font-weight:720;letter-spacing:-.035em}
.heading p{color:#718096;font-size:13px;line-height:1.55}
.eyebrow{color:#187f83;font-size:10px;letter-spacing:.12em}
.btn{
 border:1px solid #d7e0e9;background:#fff;color:#344a60;border-radius:8px;
 padding:9px 14px;font-weight:600;transition:all .18s ease
}
.btn:hover{border-color:#8fb8bc;background:#f7fbfc;color:#176f75}
.btn.primary{
 background:#176f78;border-color:#176f78;color:#fff;
 box-shadow:0 3px 8px rgba(23,111,120,.15)
}
.btn.primary:hover{background:#125c64;border-color:#125c64;transform:translateY(-1px)}
.btn.danger{color:#b54747}
.hero{
 background:linear-gradient(110deg,#fff 0%,#f4f9fa 100%);
 border:1px solid #dce7ec;border-radius:15px;padding:23px;
 box-shadow:0 7px 22px rgba(27,55,78,.045)
}
.heroIcon{background:#e6f1f2;color:#176f78;border-radius:13px}
.hero h2{color:#1d344b;font-size:21px;letter-spacing:-.02em}
.hero p{color:#6d7e90}
.stats{gap:13px;margin:16px 0 25px}
.stat,.panel,.step,.quick-card,.complaint-card{
 border-color:#dce4ec;border-radius:12px;
 box-shadow:0 3px 12px rgba(25,48,72,.035)

.stat{padding:17px 18px;position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#3a9a9d}
.stat span{color:#77879a;font-weight:550}
.stat strong{color:#1d344b;font-size:25px;letter-spacing:-.03em}
.sectionTitle h2{color:#20364d;font-size:18px}
.step{

}
.step:hover{

 box-shadow:0 9px 20px rgba(25,67,85,.07)
}
.num{background:#e8f1f4;color:#285b70}
.step h3{color:#233a51}
.step p{color:#78879a;line-height:1.5}
.step small{color:#187f83}
.panel{background:#fff}
.panelHead{border-bottom:1px solid #edf1f5}

.smallbtn{color:#176f78;font-weight:650}

.welcome{background:linear-gradient(110deg,#173653,#176f78);box-shadow:0 8px 22px rgba(23,70,91,.14)}
.welcome p{color:#d5e8e9}
.login{border-color:#dce4ec;box-shadow:0 12px 32px rgba(23,48,72,.07)}
.toast{background:#1b344d;box-shadow:0 8px 24px rgba(13,31,49,.2)}
.global-search{background:#f7f9fb;border-color:#dce4ec}
.global-search:focus{outline:0;border-color:#4a9da0;box-shadow:0 0 0 3px rgba(44,137,141,.1)}

.tool-btn:hover{border-color:#8fb8bc;color:#176f78;background:#f8fbfc}
.quick-card .qicon{background:#e7f2f3;color:#176f78}
.quick-card b{color:#263e55}
.quick-card button{color:#176f78}
.smart-notice{background:#fff9ed;border-color:#f0e2c6;color:#765a2b}

function unitImages(u){if(Array.isArray(u?.imagenes)&&u.imagenes.length)return u.imagenes.filter(Boolean).slice(0,10);return u?.imagen?[u.imagen]:[]}
function unitPhoto(u,index=0){return unitImages(u)[0]||u?.imagen||apartmentPhotos[index%apartmentPhotos.length]}
function unitFee(u){let today=todayISO(),active=db.tariffs.filter(t=>t.unit===u?.id&&(!t.desde||t.desde<=today)&&(!t.hasta||t.hasta>=today)).sort((a,b)=>String(b.desde||'').localeCompare(String(a.desde||'')))[0];return Number(active?.monto??u?.cuota_mantenimiento??0)}
function units(){let addAction=btn('＋ Registrar apartamento','add',true);let cards=db.units.map((u,i)=>{let b=db.buildings.find(x=>x.id===u.building),c=db.condos.find(x=>x.id===b?.condo),people=db.links.filter(l=>l.unit===u.id&&(!l.hasta||l.hasta>=todayISO())).map(l=>db.people.find(p=>p.id===l.person)?.nombre).filter(Boolean),photos=unitImages(u);return `<article class="unit-card" data-unit-card="${u.id}" data-search-row data-search-text="${esc((u.numero+' '+(b?.nombre||'')+' '+(c?.nombre||'')).toLowerCase())}"><div class="unit-card-photo"><img src="${esc(unitPhoto(u,i))}" alt="Fotografía del apartamento ${esc(u.numero)}" loading="lazy" onerror="this.onerror=null;this.src='${apartmentPhotos[0]}'"></div><div class="unit-card-body"><div class="unit-card-top"><div><span class="eyebrow">APARTAMENTO</span><h3>${esc(u.numero)}</h3></div><span class="badge ${u.estado==='Inactivo'?'warn':''}">${esc(u.estado||'Desocupado')}</span></div><p>${esc(b?.nombre||'Sin edificio')} · ${esc(c?.nombre||'Sin condominio')} · Piso ${esc(u.piso||'—')}</p><div class="unit-card-meta"><span>Cuota mensual individual</span><strong>${money(unitFee(u))}</strong></div><div class="unit-card-meta"><span>Parqueos</span><strong>${esc(u.parqueos||'0')}</strong></div><small class="hint">${people.length?esc(people.join(', ')):'Sin residentes vinculados'}</small><div class="unit-card-actions"><button class="smallbtn" data-view="${u.id}">Ver ficha</button><button class="smallbtn" data-unit-gallery="${u.id}">Fotos ${photos.length}/10</button>${actions(u.id)}</div></div></article>`}).join('');return heading('Apartamentos','Registra tantos apartamentos como necesites. Cada apartamento puede tener hasta 10 fotografías y su cuota mensual individual.',addAction)+`<div class="unit-limit-bar"><strong>${db.units.length} apartamento(s) registrados</strong><span>Máximo de 10 fotos por apartamento</span></div><div class="toolbar"><input class="field" id="search" placeholder="Buscar apartamento o edificio…" value="${esc '&&!record?'required':''} ${type==='password'?'autocomplete="new-password"':''}>`}return `<label>${esc(label)}${control}</label>`}).join('');document.getElementById('overlay').innerHTML=`<div class="modalback" data-close><section class="modal"><div class="modalHead"><b>${esc(title)}</b><button class="btn" type="button" data-close aria-label="Cerrar">×</button></div><form id="recordForm" class="modalBody"><div class="formgrid">${fs}</div><div class="modalFoot"><button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form></section></div>`}

function avatarMarkup(item,cls=''){let name=item?.reporterName||'Residente';let initials=name.trim().split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()||'').join('')||'R';return `<div class="profile-avatar ${cls}">${item?.avatar?`<img src="${item.avatar}" alt="Foto de ${esc(name)}">`:esc(initials)}</div>`}

function bindProfilePreview(formEl){let resident=formEl.querySelector('[name=reporter]'),file=formEl.querySelector('#complaintPhoto'),hidden=formEl.querySelector('[name=avatar]'),preview=formEl.querySelector('#complaintAvatarPreview'),nameEl=formEl.querySelector('#complaintProfileName');const updateName=()=>{let person=db.people.find(p=>p.id===resident?.value),name=person?.nombre||'Residente';nameEl.textContent=name;if(!hidden.value)preview.innerHTML=avatarMarkup({reporterName:name})};resident?.addEventListener('change',updateName);file?.addEventListener('change',()=>{let f=file.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){notify('Selecciona una imagen válida.');file.value='';return}if(f.size>8*1024*1024){notify('La imagen debe pesar menos de 8 MB.');file.value='';return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let canvas=document.createElement('canvas'),scale=Math.min(1,320/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.82);hidden.value=data;preview.innerHTML=`<div class="profile-avatar"><img src="${data}" alt="Vista previa de la foto"></div>`};img.src=reader.result};reader.readAsDataURL(f)});formEl.querySelector('#removeComplaintPhoto')?.addEventListener('click',()=>{hidden.value='';file.value='';updateName();notify('Se restauró el avatar generado por el sistema.')})}

function complaintsPage(){let cases=db.tickets.filter(t=>t.tipo==='Queja');let changed=false;cases.forEach((t,i)=>{if(!t.referencia){let y=String(t.fecha||'').match(/\b(20\d{2})\b/)?.[1]||new Date().getFullYear();t.referencia=`QUE-${y}-${String(i+1).padStart(4,'0')}`;changed=true}});if(changed)save();let counts={Total:cases.length,Pendientes:cases.filter(t=>complaintGroup(t.status||'Abierta')==='Pendientes').length,'En revisión':cases.filter(t=>complaintGroup(t.status)==='En revisión').length,Resueltas:cases.filter(t=>complaintGroup(t.status)==='Resueltas').length};let visible=complaintStatusFilter==='Todas'?cases:cases.filter(t=>complaintGroup(t.status||'Abierta')===complaintStatusFilter);let cards=visible.map(t=>{let person=db.people.find(p=>p.id===t.reporter);let displayName=t.reporterName||person?.nombre||'Residente';let item={...t,reporterName:displayName};return `<article class="complaint-card"><div class="complaint-ref-row"><span class="complaint-ref-label">IDENTIFICADOR DE QUEJA</span><strong class="complaint-ref">${esc(t.referencia)}</strong></div><div class="complaint-card-top">${avatarMarkup(item)}<div class="complaint-card-title"><strong>${esc(displayName)}</strong><small>${esc(t.fecha||'Fecha no disponible')} · Apartamento ${esc(t.unidad||'—')}</small></div><span class="badge ${t.status==='Abierta'?'warn':''}">${esc(t.status||'Abierta')}</span></div><p><b>${esc(t.asunto)}</b><br>${esc(t.descripcion||'Sin descripción')}</p><div class="complaint-card-foot"><div class="complaint-tags"><span class="badge ${t.prioridad==='Urgente'?'red':t.prioridad==='Alta'?'warn':''}">${esc(t.prioridad||'Normal')}</span><span class="hint">${esc(t.responsable||'Sin asignar')}</span></div><div class="actions"><button class="smallbtn" data-case="${t.id}">Gestionar</button><button class="smallbtn" data-del="${t.id}">Eliminar</button></div></div></article>`}).join('');let statCard=(label,value,key)=>`<button type="button" class="stat complaint-stat ${complaintStatusFilter===key?'selected':''}" data-complaint-filter="${key}"><span>${label}</span><strong>${value}</strong><small>${key==='Todas'?'Ver todas las quejas':'Filtrar listado'}</small></button>`;return heading('Quejas de residentes','Cada queja muestra el perfil del residente, su apartamento y el seguimiento administrativo.',btn('+ Registrar queja','add',true))+`<div class="stats">${statCard('Total de quejas',counts.Total,'Todas')}${statCard('Pendientes',counts.Pendientes,'Pendientes')}${statCard('En revisión',counts['En revisión'],'En revisión')}${statCard('Resueltas',counts.Resueltas,'Resueltas')}</div><div class="complaint-list-heading"><div><b>${complaintStatusFilter==='Todas'?'Todas las quejas':complaintStatusFilter}</b><span>${visible.length} ${visible.length===1?'registro':'registros'}</span></div>${complaintStatusFilter!=='Todas'?'<button class="smallbtn" data-complaint-filter="Todas">Quitar filtro ×</button>':''}</div>${cards?`<div class="complaint-grid">${cards}</div>`:`<div class="complaint-empty"><div style="font-size:30px;margin-bottom:9px">✦</div><b>${cases.length?'No hay quejas en esta categoría':'Todavía no hay quejas registradas'}</b><p>${cases.length?'Selecciona otra tarjeta para consultar los demás estados.':'Cuando un residente presente una queja, su perfil aparecerá aquí con su fotografía o avatar.'}</p></div>`}`}

// CONTRATOS Y COBROS: compra financiada/de contado, alquiler y mantenimiento

function contractTypeLabel(c){return c.tipo_contrato==='Alquiler'?'Alquiler':c.tipo_contrato==='Compra de contado'?'Compra de contado':'Compra financiada'}
function contractPerson(c){return db.people.find(p=>p.id===c.titular)?.nombre||c.titular_nombre||'Sin titular'}
function contractUnit(c){return db.units.find(u=>u.id===c.unit)}
function contractSchedule(c){return (db.installments||[]).filter(q=>q.contractId===c.id).sort((a,b)=>a.number-b.number)}
function dateAtMonth(base,offset,day){let d=new Date(base+'T12:00:00');let month=new Date(d.getFullYear(),d.getMonth()+offset,1,12);let last=new Date(month.getFullYear(),month.getMonth()+1,0,12).getDate();month.setDate(Math.min(Math.max(1,Number(day)||d.getDate()),last));return month.toISOString().slice(0,10)}
function calculateMonthlyPayment(principal,annualRate,months){let n=Math.max(1,Number(months)||1),r=Math.max(0,Number(annualRate)||0)/1200;if(!r)return Math.round(principal/n*100)/100;return Math.round((principal*r/(1-Math.pow(1+r,-n)))*100)/100}
function buildContractSchedule(c){let rows=[],start=c.fecha_inicio,day=Number(c.dia_vencimiento)||new Date(start+'T12:00:00').getDate();if(c.tipo_contrato==='Compra de contado'){rows.push({id:id(),contractId:c.id,number:1,total:1,kind:'Compra de contado',date:start,amount:Number(c.precio_total),status:'Programada',concept:'Compra de contado'});return rows}if(c.tipo_contrato==='Alquiler'){let months=Math.max(1,Number(c.duracion_meses)||1),rent=Number(c.renta_mensual);for(let i=1;i<=months;i++){rows.push({id:id(),contractId:c.id,number:i,total:months,kind:'Alquiler',date:dateAtMonth(start,i-1,day),amount:rent,status:'Programada',concept:'Alquiler mensual'});}return rows}let principal=Math.max(0,Number(c.precio_total)-Number(c.inicial||0)),months=Math.max(1,Number(c.duracion_meses)||1),rate=Number(c.interes_anual)||0,payment=Number(c.cuota_mensual)>0?Number(c.cuota_mensual):calculateMonthlyPayment(principal,rate,months),balance=principal;if(Number(c.inicial)>0)rows.push({id:id(),contractId:c.id,number:0,total:months,kind:'Inicial de compra',date:start,amount:Number(c.inicial),status:'Programada',concept:'Inicial de compra'});for(let i=1;i<=months;i++){let interest=Math.round(balance*(rate/1200)*100)/100,amount=rate>0?Math.min(payment,balance+interest):Math.min(payment,balance);if(i===months||amount<=0)amount=Math.round((balance+interest)*100)/100;balance=Math.max(0,Math.round((balance-(amount-interest))*100)/100);rows.push({id:id(),contractId:c.id,number:i,total:months,kind:'Compra financiada',date:dateAtMonth(start,c.inicial>0?i:i-1,day),amount:Math.round(amount*100)/100,status:'Programada',concept:'Cuota de compra'});}return rows}
function issueDueContractInvoices(){let today=new Date(),limit=new Date(today.getFullYear(),today.getMonth(),today.getDate()+30,12);(db.installments||[]).forEach(q=>{if(q.invoiceId||q.status!=='Programada')return;let c=db.contracts.find(x=>x.id===q.contractId);if(!c||c.estado!=='Activo'||c.archivado)return;let due=new Date(q.date+'T12:00:00');if(due>limit)return;let u=contractUnit(c),person=db.people.find(p=>p.id===c.titular),invoice={id:id(),numero:'FAC-CT-'+Date.now().toString().slice(-7)+'-'+String(q.number).padStart(2,'0'),unit:c.unit,unidad:u?.numero||'—',payer:c.titular,contractId:c.id,installmentId:q.id,tipoObligacion:c.tipo_contrato,acreedor:c.acreedor||'',concepto:(q.kind==='Inicial de compra'?'Inicial de compra':q.kind==='Compra de contado'?'Compra de apartamento':q.kind==='Alquiler'?'Alquiler mensual':'Cuota '+q.number+' de '+q.total+' · Compra financiada'),fecha:today.toISOString().slice(0,10),vence:q.date,monto:Number(q.amount),paidAmount:0,status:q.date<today.toISOString().slice(0,10)?'Vencida':'Pendiente'};db.invoices.unshift(invoice);q.invoiceId=invoice.id;q.status='Facturada';let email=person?.correo;if(email){pushNotification(email,'Nuevo cobro programado',invoice.concepto+' · '+money(invoice.monto)+' · Vence '+invoice.vence+'. Acreedor: '+(c.acreedor||'según contrato')+'.','Cobro');} });save()}

function todayISO() {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Santo_Domingo', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
  const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
function localStamp() { return new Date().toLocaleString('es-DO', { timeZone: 'America/Santo_Domingo' }); }
function localDateLabel(v) { if (!v) return '—'; const d = new Date(String(v).slice(0, 10) + 'T12:00:00'); return Number.isNaN(d.getTime()) ? String(v) : d.toLocaleDateString('es-DO', { timeZone: 'America/Santo_Domingo' }); }
function roundMoney(v) { return Math.round((Number(v) + Number.EPSILON) * 100) / 100; }
function invoiceBalance(inv) {
  if (!inv) return 0;
  const amount = Math.max(0, Number(inv.monto) || 0);
  if (inv.status === 'Pagada' && inv.paidAmount == null) return 0; // compatibilidad con facturas pagadas antiguas
  return roundMoney(Math.max(0, amount - Math.max(0, Number(inv.paidAmount) || 0) - Math.max(0, Number(inv.creditedAmount) || 0)));
}
function invoicePaid(inv) { if(inv?.status==='Pagada'&&inv.paidAmount==null)return roundMoney(Math.max(0,Number(inv.monto||0)-Number(inv.creditedAmount||0))); return roundMoney(Math.max(0, Number(inv?.paidAmount) || 0)); }
function updateInvoiceStatus(inv) {
  const bal = invoiceBalance(inv);
  if (bal <= 0.009) inv.status = 'Pagada';
  else if (invoicePaid(inv) > 0) inv.status = 'Parcial';
  else inv.status = inv.vence && inv.vence < todayISO() ? 'Vencida' : 'Pendiente';
  return inv.status;
}
function activeLink(link, date = todayISO()) {
  return (!link.desde || link.desde <= date) && (!link.hasta || link.hasta >= date) && link.estado !== 'Inactivo';
}
function activePayerAssignments(unitId, date = todayISO()) {
  return db.payers.filter(p => p.unit === unitId && (!p.desde || p.desde <= date) && (!p.hasta || p.hasta >= date) && p.estado !== 'Inactivo');
}
function effectiveMaintenancePayers(unitId, date = todayISO()) {
  const configured = activePayerAssignments(unitId, date);
  if (configured.length) return configured.filter(p => Number(p.porcentaje) > 0 && Number(p.porcentaje) <= 100).map(p => ({ person: p.person, porcentaje: Number(p.porcentaje || 0), source: 'Configuración de responsables' }));
  const owners = db.links.filter(l => l.unit === unitId && activeLink(l, date) && l.rol === 'Propietario');
  if (owners.length === 1) return [{ person: owners[0].person, porcentaje: 100, source: 'Propietario vinculado' }];
  if (owners.length > 1) return []; // Varios copropietarios: configurar porcentajes explícitos en Responsables de pago.
  const contracts = db.contracts.filter(c => c.unit === unitId && c.estado === 'Activo' && !c.archivado && (!c.fecha_inicio || c.fecha_inicio <= date) && (!c.fecha_fin || c.fecha_fin >= date));
  const chosen = contracts.find(c => c.responsableMantenimiento) || contracts.find(c => c.tipo_contrato !== 'Alquiler' && (c.propietario || c.titular));
  const idPayer = chosen?.responsableMantenimiento || chosen?.propietario || (chosen?.tipo_contrato === 'Alquiler' ? '' : chosen?.titular);
  return idPayer ? [{ person: idPayer, porcentaje: 100, source: 'Contrato vigente' }] : [];
}
function invoiceVisibleToResident(inv, personId, unitIds, date = todayISO()) {
  if (!inv || !personId || !unitIds.includes(inv.unit)) return false;
  const contract = inv.contractId ? db.contracts.find(c => c.id === inv.contractId) : null;
  const designated = inv.payer || inv.responsablePago || contract?.responsablePago || contract?.titular || '';
  if (designated) return designated === personId;
  // Compatibilidad con cargos antiguos: solo mostrar al pagador configurado o al
  // único responsable que resulte de las reglas vigentes en la fecha de obligación.
  const obligationDate = inv.vence || inv.fecha || date;
  const payers = effectiveMaintenancePayers(inv.unit, obligationDate);
  return payers.length > 0 && payers.some(p => p.person === personId);
}

function attachmentData(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    if (file.size > 5 * 1024 * 1024) return reject(new Error('Cada archivo debe pesar como máximo 5 MB.'));
    const r = new FileReader();
    r.onerror = () => reject(new Error('No se pudo leer el archivo.'));
    r.onload = () => resolve({ name: file.name, type: file.type, size: file.size, data: String(r.result || '') });

  });
}

function dueDayDate(period, day) {
  const [y, m] = period.split('-').map(Number); const last = new Date(y, m, 0).getDate();
  return `${period}-${String(Math.min(Math.max(1, Number(day) || 10), last)).padStart(2, '0')}`;
}
function periodMatches(freq, period, startPeriod = '') {
  const name = String(freq || 'Mensual').toLowerCase();
  if (startPeriod && period < startPeriod) return false;
  if (name === 'único' || name === 'unico') return !!startPeriod && period === startPeriod;
  const interval = name === 'anual' ? 12 : name === 'trimestral' ? 3 : name === 'bimestral' ? 2 : 1;
  const anchor = startPeriod || (interval === 12 ? period.slice(0,4) + '-01' : '2000-01');
  const [ay, am] = anchor.slice(0,7).split('-').map(Number), [py, pm] = period.slice(0,7).split('-').map(Number);
  const diff = (py - ay) * 12 + (pm - am);
  return diff >= 0 && diff % interval === 0;
}

function quotaAppliesToUnit(quota, unit, period) {
  if (!quota || !unit || quota.estado === 'Inactiva') return false;
  const month = String(period || '').slice(0, 7);
  if (!/^\d{4}-\d{2}$/.test(month)) return false;
  const start = String(quota.desde || '0000-01-01').slice(0, 10);
  const end = String(quota.hasta || '9999-12-31').slice(0, 10);
  const periodStart = `${month}-01`;
  const periodEnd = `${month}-31`;
  if (start > periodEnd || end < periodStart) return false;
  const building = db.buildings.find(item => item.id === unit.building);
  if (!building) return false;
  if (quota.condo && quota.condo !== 'all' && building.condo !== quota.condo) return false;
  if (quota.building && quota.building !== 'all' && unit.building !== quota.building) return false;
  if (quota.unit && quota.unit !== 'all' && unit.id !== quota.unit) return false;
  const firstPeriod = start === '0000-01-01' ? '' : start.slice(0, 7);
  return periodMatches(quota.frecuencia, month, firstPeriod);
}

// 1. Relaciones de responsables con validación de períodos no solapados
validatePayer = function(d) {
  const pct = Number(d.porcentaje), start = d.desde || todayISO(), end = d.hasta || '9999-12-31';
  if (!d.unit || !d.person) { notify('Selecciona un apartamento y una persona.'); return false; }
  if (!(pct > 0 && pct <= 100)) { notify('El porcentaje debe ser mayor que 0 y no superar 100.'); return false; }
  if (d.hasta && d.hasta < start) { notify('La fecha final no puede ser anterior a la inicial.'); return false; }
  const overlaps = db.payers.filter(p => p.unit === d.unit && p.id !== editingId && (p.desde || '0000-01-01') <= end && (p.hasta || '9999-12-31') >= start);
  if (overlaps.some(p => p.person === d.person)) { notify('La persona ya tiene una asignación que se cruza con ese período.'); return false; }
  const points = new Set([start]);
  overlaps.forEach(p => { if (p.desde && p.desde >= start && p.desde <= end) points.add(p.desde); if (p.hasta && p.hasta >= start && p.hasta <= end) points.add(p.hasta); });
  for (const point of points) {
    const assigned = overlaps.filter(p => (!p.desde || p.desde <= point) && (!p.hasta || p.hasta >= point)).reduce((n, p) => n + Number(p.porcentaje || 0), 0) + pct;
    if (assigned > 100.001) { notify(`La asignación supera el 100 % a partir del ${localDateLabel(point)}.`); return false; }
  }
  if (d.tipo_responsabilidad === 'Responsable principal' && (pct !== 100 || overlaps.length)) { notify('Un responsable principal debe cubrir el 100 % y no puede solaparse con otra asignación.'); return false; }
  return true;
};

// 2. Contratos y calendarios con fechas de vencimiento coherentes
function addMonthsISO(base, offset, day) {
  const [y, m] = base.split('-').map(Number); const target = new Date(y, m - 1 + offset, 1, 12);
  const last = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
  target.setDate(Math.min(Math.max(1, Number(day) || 1), last));
  return `${target.getFullYear()}-${String(target.getMonth() + 1).padStart(2, '0')}-${String(target.getDate()).padStart(2, '0')}`;
}
dateAtMonth = addMonthsISO;
function firstContractDue(start, day, offset = 0) {
  // Encuentra el primer vencimiento estrictamente posterior al inicio y luego
  // avanza los meses solicitados sin repetir el primer mes si el día ya pasó.
  const sameMonth = addMonthsISO(start, 0, day);
  const firstOffset = sameMonth <= start ? 1 : 0;
  return addMonthsISO(start, firstOffset + Math.max(0, Number(offset) || 0), day);
}
buildContractSchedule = function(c) {
  const rows = [], start = c.fecha_inicio, day = Number(c.dia_vencimiento) || Number(start.slice(8, 10));
  if (c.tipo_contrato === 'Compra de contado') {
    rows.push({ id: id(), contractId: c.id, number: 1, total: 1, kind: 'Compra de contado', date: start, amount: roundMoney(c.precio_total), status: 'Programada', concept: 'Compra de contado' });
    return rows;
  }
  const months = Math.max(1, Number(c.duracion_meses) || 1);
  if (c.tipo_contrato === 'Alquiler') {
    if(Number(c.deposito_garantia||0)>0) rows.push({ id:id(), contractId:c.id, number:0, total:months, kind:'Depósito de garantía', date:start, amount:roundMoney(c.deposito_garantia), status:'Programada', concept:'Depósito de garantía de alquiler' });
    for (let n = 1; n <= months; n++) rows.push({ id: id(), contractId: c.id, number: n, total: months, kind: 'Alquiler', date: firstContractDue(start, day, n - 1), amount: roundMoney(c.renta_mensual), status: 'Programada', concept: 'Alquiler mensual' });
    return rows;
  }
  const principal = Math.max(0, Number(c.precio_total) - Number(c.inicial || 0)), rate = Number(c.interes_anual) || 0;
  const payment = Number(c.cuota_mensual) > 0 ? Number(c.cuota_mensual) : calculateMonthlyPayment(principal, rate, months);
  let balance = principal;
  if (Number(c.inicial) > 0) rows.push({ id: id(), contractId: c.id, number: 0, total: months, kind: 'Inicial de compra', date: start, amount: roundMoney(c.inicial), status: 'Programada', concept: 'Inicial de compra' });
  for (let n = 1; n <= months; n++) {
    const interest = roundMoney(balance * rate / 1200);
    let amount = rate > 0 ? Math.min(payment, balance + interest) : Math.min(payment, balance);
    if (n === months || amount <= 0) amount = roundMoney(balance + interest);
    amount = roundMoney(amount);
    balance = Math.max(0, roundMoney(balance - (amount - interest)));
    const monthOffset = n - 1;
    rows.push({ id: id(), contractId: c.id, number: n, total: months, kind: 'Compra financiada', date: firstContractDue(start, day, monthOffset), amount, status: 'Programada', concept: 'Cuota de compra', principal: roundMoney(Math.max(0, amount - interest)), interest });
  }
  return rows;
};

saveContractFromForm = function(f) {
  const d = Object.fromEntries(new FormData(f)), type = d.tipo_contrato, unit = db.units.find(u => u.id === d.unit), holder = db.people.find(p => p.id === d.titular);
  if (!unit || !holder) { notify('Selecciona un apartamento y un comprador o inquilino válido.'); return; }
  const amount = Number(d.precio_total), months = Number(d.duracion_meses), initial = Number(d.inicial || 0), rate = Number(d.interes_anual || 0), day = Number(d.dia_vencimiento), start = d.fecha_inicio;
  if (!(amount > 0) || !start || !(day >= 1 && day <= 28) || rate < 0 || rate > 100) { notify('Revisa el importe, fecha, interés y día de vencimiento.'); return; }
  if (type === 'Compra financiada' && (!(months >= 1) || initial < 0 || initial >= amount)) { notify('La compra financiada requiere un plazo válido y una inicial menor al precio.'); return; }
  if (type === 'Alquiler' && !(months >= 1)) { notify('Indica la duración del alquiler en meses.'); return; }
  if (type === 'Compra de contado' && initial > 0) { notify('La compra de contado programa el precio completo en un solo pago; no necesita inicial separada.'); return; }
  const old = editingContractId ? db.contracts.find(x => x.id === editingContractId) : null;
  if (old && db.invoices.some(i => i.contractId === old.id)) { notify('No se puede modificar un contrato con facturas emitidas. Archívalo y crea uno nuevo para conservar la trazabilidad.'); return; }
  const newEnd = type === 'Compra de contado' ? start : firstContractDue(start, day, months - 1);
  const conflicting = db.contracts.find(x => x.id !== old?.id && x.unit === unit.id && x.estado === 'Activo' && !x.archivado && x.tipo_contrato === type && (x.fecha_inicio || '0000-01-01') <= newEnd && (x.fecha_fin || '9999-12-31') >= start);
  if (conflicting) { notify('Ya existe un contrato activo del mismo tipo para ese apartamento y período. Revisa las fechas o archiva el contrato anterior.'); return; }
  const creditor = db.people.find(p => p.id === d.acreedorPersona);
  const c = { ...d, id: old?.id || id(), codigo: old?.codigo || 'CTR-' + Date.now().toString().slice(-7), estado: d.estado || 'Activo', precio_total: type === 'Alquiler' ? 0 : amount, renta_mensual: type === 'Alquiler' ? amount : 0, inicial: type === 'Compra financiada' ? initial : 0, duracion_meses: type === 'Compra de contado' ? 1 : months, interes_anual: type === 'Compra financiada' ? rate : 0, cuota_mensual: type === 'Alquiler' ? amount : type === 'Compra de contado' ? amount : (Number(d.cuota_mensual) > 0 ? Number(d.cuota_mensual) : calculateMonthlyPayment(amount - initial, rate, months)), responsablePago: d.responsablePago || holder.id, responsableMantenimiento: d.responsableMantenimiento || (type === 'Alquiler' ? (d.propietario || '') : holder.id), acreedor: (d.acreedor || creditor?.nombre || '').trim(), fecha_inicio: start, fecha_fin: newEnd, dia_vencimiento: day, fechaCreacion: old?.fechaCreacion || localStamp(), archivado: old?.archivado || false };
  if (!c.acreedor) { notify('Indica quién es el acreedor o autorizado a cobrar.'); return; }
  if (type === 'Compra financiada') {
    const principal = amount - initial, monthlyInterest = principal * rate / 1200;
    if (c.cuota_mensual <= monthlyInterest && rate > 0) { notify('La cuota mensual debe superar el interés mensual para amortizar la deuda.'); return; }
  }
  if (old) { db.installments = db.installments.filter(q => q.contractId !== old.id); db.contracts[db.contracts.findIndex(x => x.id === old.id)] = c; }
  else db.contracts.unshift(c);
  if (c.estado === 'Activo') db.installments.unshift(...buildContractSchedule(c));
  editingContractId = null; audit('Contratos', c.id, old ? 'Contrato actualizado' : 'Contrato creado', `${contractTypeLabel(c)} · ${unit.numero} · ${c.acreedor}`);
  save(); document.getElementById('overlay').innerHTML = ''; page = 'contracts'; render(); notify('Contrato guardado. Se creó el calendario con vencimientos válidos.');
};
issueDueContractInvoices = function() {
  const today = todayISO(), [y, m, d] = today.split('-').map(Number), limitDate = new Date(y, m - 1, d + 30, 12), limit = `${limitDate.getFullYear()}-${String(limitDate.getMonth()+1).padStart(2,'0')}-${String(limitDate.getDate()).padStart(2,'0')}`;
  let changed = false;
  (db.installments || []).forEach(q => {
    if (q.invoiceId || !['Programada','Requiere responsable'].includes(q.status)) return;
    const c = db.contracts.find(x => x.id === q.contractId);
    if (!c || c.estado !== 'Activo' || c.archivado || q.date < c.fecha_inicio || (c.fecha_fin && q.date > c.fecha_fin) || q.date > limit) return;
    const u = contractUnit(c), payerId = c.responsablePago || (c.tipo_contrato === 'Alquiler' ? c.titular : c.titular), payer = db.people.find(p => p.id === payerId);
    if (!payerId || !payer) { if(q.status!=='Requiere responsable'){q.status='Requiere responsable';audit('Contratos',c.id,'Cuota sin responsable',`Cuota ${q.number} · ${q.date}`);changed=true;} return; }
    if(q.status==='Requiere responsable'){q.status='Programada';changed=true;}
    const inv = { id: id(), numero: 'FAC-CTR-' + Date.now().toString().slice(-7) + '-' + String(q.number).padStart(2, '0'), unit: c.unit, unidad: u?.numero || '—', payer: payerId, payerName: payer?.nombre || '', contractId: c.id, installmentId: q.id, tipoObligacion: c.tipo_contrato, acreedor: c.acreedor || '', acreedorPersona: c.acreedorPersona || '', concepto: q.kind === 'Inicial de compra' ? 'Inicial de compra' : q.kind === 'Depósito de garantía' ? 'Depósito de garantía de alquiler' : q.kind === 'Compra de contado' ? 'Compra de apartamento' : q.kind === 'Alquiler' ? 'Alquiler mensual' : `Cuota ${q.number} de ${q.total} · Compra financiada`, fecha: today, vence: q.date, monto: roundMoney(q.amount), paidAmount: 0, status: q.date < today ? 'Vencida' : 'Pendiente', chargeKey: `contract|${c.id}|${q.id}` };
    db.invoices.unshift(inv); q.invoiceId = inv.id; q.status = 'Facturada'; changed = true;
    if (payer?.correo && !q.notificationSent) { pushNotification(payer.correo, 'Nueva factura disponible', `${inv.concepto}: ${money(inv.monto)}. Vence ${localDateLabel(inv.vence)}. Acreedor: ${c.acreedor}.`, 'Cobro'); q.notificationSent = true; }
    audit('Facturas', inv.id, 'Factura generada', `${inv.numero} · ${inv.concepto}`);
  });
  if (changed) save();
};

function generateBillingForPeriod(period) {
  if (!/^\d{4}-\d{2}$/.test(period || '')) { notify('Selecciona un período válido.'); return; }
  let created=0, skipped=[]; const activeUnits=db.units.filter(u=>!['Inactivo','En mantenimiento'].includes(u.estado));
  activeUnits.forEach(u=>{
    const building=db.buildings.find(b=>b.id===u.building), condoId=building?.condo||'';
    const charges=[];
    db.quotas.filter(q=>{
      const frequency=q.frecuencia||'Mensual';
      const anchor=q.desde?String(q.desde).slice(0,7):'';
      if(['Único','Unico'].includes(frequency)&&!q.desde){skipped.push(`${u.numero} · ${q.nombre||'Cargo único'}: define una fecha de inicio.`);return false;}
      return quotaAppliesToUnit(q,u,period);
    }).forEach(q=>charges.push({key:`quota|${q.id}|${u.id}|${period}`,concepto:q.nombre||'Cargo de condominio',monto:Number(q.monto||0),dia:q.dia||u.dia_vencimiento||10,frecuencia:q.frecuencia||'Mensual',desde:q.desde||'',hasta:q.hasta||'',source:'Regla de cobro'}));
    const tariff=db.tariffs.filter(t=>t.unit===u.id&&(!t.desde||t.desde<=period+'-31')&&(!t.hasta||t.hasta>=period+'-01')).sort((a,b)=>String(b.desde||'').localeCompare(String(a.desde||'')))[0];
    const maintAmount=Number(tariff?.monto??u.cuota_mantenimiento??0);
    if(maintAmount>0){
      const maintenanceQuota=charges.some(ch=>/mantenimiento/i.test(ch.concepto));
      if(!maintenanceQuota)charges.push({key:`maintenance|${u.id}|${period}`,concepto:'Cuota de mantenimiento',monto:maintAmount,dia:tariff?.dia||u.dia_vencimiento||10,frecuencia:'Mensual',desde:tariff?.desde||'',hasta:tariff?.hasta||'',source:tariff?'Tarifa individual':'Cuota del apartamento'});
    }
    db.services.filter(s=>s.estado==='Activo'&&s.metodo==='Monto fijo'&&s.unit===u.id&&periodMatches(s.frecuencia||'Mensual',period,s.desde?String(s.desde).slice(0,7):'')).forEach(s=>charges.push({key:`service|${s.id}|${u.id}|${period}`,concepto:`Servicio: ${s.servicio}`,monto:Number(s.monto||0),dia:s.dia||u.dia_vencimiento||10,frecuencia:s.frecuencia||'Mensual',desde:s.desde||'',hasta:s.hasta||'',source:'Servicio fijo'}));
    db.services.filter(s=>s.estado==='Activo'&&s.metodo==='Distribuido entre unidades'&&periodMatches(s.frecuencia||'Mensual',period,s.desde?String(s.desde).slice(0,7):'')).forEach(s=>{
      const ref=db.units.find(z=>z.id===s.unit), refBuilding=db.buildings.find(b=>b.id===ref?.building);
      if(!refBuilding||refBuilding.condo!==condoId)return;
      const related=activeUnits.filter(z=>db.buildings.find(b=>b.id===z.building)?.condo===condoId);
      if(related.length)charges.push({key:`distributed|${s.id}|${u.id}|${period}`,concepto:`Distribución: ${s.servicio}`,monto:roundMoney(Number(s.monto||0)/related.length),dia:s.dia||u.dia_vencimiento||10,frecuencia:s.frecuencia||'Mensual',desde:s.desde||'',hasta:s.hasta||'',source:'Servicio distribuido'});
    });
    (db.serviceReadings||[]).filter(r=>r.unit===u.id&&r.status==='Pendiente'&&r.periodo===period).forEach(r=>charges.push({key:`reading|${r.id}|${period}`,concepto:`Consumo ${db.services.find(s=>s.id===r.service)?.servicio||'servicio'} · ${r.periodo}`,monto:Number(r.importe||0),dia:r.dia||u.dia_vencimiento||10,desde:r.desde||'',hasta:r.hasta||'',reading:r,source:'Lectura de consumo'}));
    charges.forEach(ch=>{
      if(!(ch.monto>0))return;
      let due=['Único','Unico'].includes(ch.frecuencia)?(ch.desde||dueDayDate(period,ch.dia)):dueDayDate(period,ch.dia);
      if(ch.desde&&String(ch.desde).slice(0,7)===period&&due<ch.desde)due=ch.desde;
      if((ch.desde&&due<ch.desde)||(ch.hasta&&due>ch.hasta))return;
      if(db.invoices.some(i=>i.chargeKey===ch.key)){if(ch.reading)ch.reading.status='Facturado';return;}
      const payers=effectiveMaintenancePayers(u.id,due),sum=roundMoney(payers.reduce((n,p)=>n+Number(p.porcentaje||0),0));
      if(!payers.length||Math.abs(sum-100)>.01){const warning=`${u.numero} · ${ch.concepto}: ${payers.length?`responsables suman ${sum}%`:'sin responsables de pago vigentes'} al ${localDateLabel(due)}`;if(!skipped.includes(warning))skipped.push(warning);return;}
      let allocated=0;
      payers.forEach((p,index)=>{
        const amount=index===payers.length-1?roundMoney(ch.monto-allocated):roundMoney(ch.monto*Number(p.porcentaje||0)/100);allocated=roundMoney(allocated+amount);if(amount<=0)return;
        const person=db.people.find(x=>x.id===p.person),invoice={id:id(),numero:'FAC-'+Date.now().toString().slice(-7)+'-'+Math.random().toString(36).slice(2,5).toUpperCase(),unit:u.id,unidad:u.numero,payer:p.person,payerName:person?.nombre||'',concepto:payers.length>1?`${ch.concepto} (${p.porcentaje}%)`:ch.concepto,chargeKey:ch.key,fecha:todayISO(),vence:due,monto:amount,paidAmount:0,status:'Pendiente',tipoObligacion:/mantenimiento/i.test(ch.concepto)?'Mantenimiento':'Cargo',source:ch.source||p.source||'Regla de cobro'};
        updateInvoiceStatus(invoice);db.invoices.unshift(invoice);created++;
        if(person?.correo)pushNotification(person.correo,'Nueva factura disponible',`${invoice.concepto}: ${money(invoice.monto)}. Vence ${localDateLabel(due)}.`,'Cobro',invoice.id);
      });
      if(ch.reading)ch.reading.status='Facturado';
    });
  });
  audit('Facturación',period,'Generación de cargos',`${created} facturas generadas; ${skipped.length} cargos omitidos por configuración.`);
  save();render();notify(`${created} facturas generadas para ${period}. ${skipped.length} cargo(s) requieren revisión.`);
  if(skipped.length)alert('No se generaron estos cargos:\n'+skipped.join('\n'));
}

// 4. Conciliación y pagos parciales / excedentes con registro por factura
function allocateDeposit(deposit, bankMovement) {
  if (!deposit || !bankMovement) return {ok:false,message:'No se encontró el depósito o movimiento.'};
  if (deposit.status !== 'Pendiente de verificación bancaria') return {ok:false,message:'Primero revisa el comprobante y verifica que esté pendiente de conciliación.'};
  const refA=String(deposit.referencia||'').trim().toLowerCase(), refB=String(bankMovement.referencia||'').trim().toLowerCase();
  if (!refA || refA!==refB || Math.abs(Number(deposit.monto)-Number(bankMovement.monto))>.01) return {ok:false,message:'La referencia o el importe bancario no coincide con el reporte.'};
  if (bankMovement.status==='Conciliado') return {ok:false,message:'Este movimiento bancario ya fue conciliado.'};
  const ids=[...new Set(deposit.invoiceIds || (deposit.facturaId?[deposit.facturaId]:[]))], invoices=ids.map(fid=>db.invoices.find(i=>i.id===fid));
  if (!ids.length || invoices.some(i=>!i)) return {ok:false,message:'El depósito no está relacionado con todas sus facturas.'};
  const unitIds=new Set(invoices.map(i=>i.unit)); if(unitIds.size!==1 || !unitIds.has(deposit.unit)) return {ok:false,message:'Las facturas seleccionadas deben pertenecer al apartamento del depósito.'};
  const payerEmail=String(deposit.person||'').toLowerCase(), payer=db.people.find(p=>String(p.correo||'').toLowerCase()===payerEmail), amount=roundMoney(Number(deposit.monto));
  if (!(amount>0)) return {ok:false,message:'El monto del depósito debe ser mayor que cero.'};
  if (db.paymentEntries.some(p=>p.depositId===deposit.id) || bankMovement.depositId===deposit.id) return {ok:false,message:'Este depósito ya tiene aplicaciones registradas.'};
  if (!payer) return {ok:false,message:'No se pudo identificar al responsable que reportó el depósito.'};
  if (invoices.some(i => {
    const due = i.vence || i.fecha || todayISO();
    const responsible = i.payer || i.responsablePago || (i.contractId ? db.contracts.find(c=>c.id===i.contractId)?.responsablePago : '');
    if (responsible) return responsible !== payer.id;
    return !effectiveMaintenancePayers(i.unit, due).some(x => x.person === payer.id);
  })) return {ok:false,message:'El residente que reportó el depósito no es el responsable de pago de todas las facturas seleccionadas.'};
  let remaining=amount; const allocations=[];
  invoices.sort((a,b)=>String(a.vence||'').localeCompare(String(b.vence||'')));
  invoices.forEach(inv=>{
    const balance=invoiceBalance(inv); if(balance<=.009||remaining<=.009)return;
    const applied=roundMoney(Math.min(balance,remaining));
    inv.paidAmount=roundMoney(invoicePaid(inv)+applied); updateInvoiceStatus(inv);
    const entry={id:id(),depositId:deposit.id,invoiceId:inv.id,unit:inv.unit,person:deposit.person,amount:applied,reference:deposit.referencia,bankMovementId:bankMovement.id,date:deposit.fecha||todayISO(),registeredAt:localStamp()};
    db.paymentEntries.unshift(entry); allocations.push({invoiceId:inv.id,numero:inv.numero,amount:applied}); remaining=roundMoney(remaining-applied);
    const q=db.installments.find(x=>x.invoiceId===inv.id); if(q)q.status=invoiceBalance(inv)<=.009?'Pagada':invoicePaid(inv)>.009?'Parcial':'Facturada';
  });
  if(remaining>.009){
    const unit=db.units.find(u=>u.id===deposit.unit),person=db.people.find(p=>p.id===deposit.personId)||db.people.find(p=>String(p.correo||'').toLowerCase()===payerEmail);
    db.credits.unshift({id:id(),person:person?.id||'',personName:deposit.payerName||person?.nombre||'',unit:deposit.unit,unitName:unit?.numero||deposit.unidad,amount:remaining,remaining,reference:deposit.referencia,depositId:deposit.id,createdAt:localStamp()});
  }
  deposit.status='Aprobado'; deposit.applied=roundMoney(amount-remaining); deposit.creditCreated=remaining; deposit.allocations=allocations; deposit.paymentIds=db.paymentEntries.filter(p=>p.depositId===deposit.id).map(p=>p.id); deposit.validadoPor='Administración · Conciliación bancaria'; deposit.fechaValidacion=localStamp();
  bankMovement.status='Conciliado'; bankMovement.depositId=deposit.id; bankMovement.conciliatedAt=localStamp();
  pushNotification(deposit.person,'Pago conciliado y aplicado',`Se aplicaron ${money(deposit.applied)} a ${allocations.length} factura(s). ${remaining>.009?'Se generó un crédito a favor de '+money(remaining)+'.':'No quedó saldo a favor.'}`,'Pago');
  audit('Depósitos',deposit.id,'Depósito conciliado',`${money(amount)} · ${allocations.length} facturas`); save();
  return {ok:true,message:'Depósito conciliado. '+allocations.length+' factura(s) actualizadas'+(remaining>.009?'; crédito a favor '+money(remaining):'')+'.'};
}

// 5. Avisos: destinatarios vigentes, torres filtradas, programación y lectura
recipientsForAnnouncement = function(d) {
  const targetDate=d.publicacion||todayISO();
  const result=[];
  db.links.filter(l=>activeLink(l,targetDate)).forEach(link=>{
    const person=db.people.find(p=>p.id===link.person), unit=db.units.find(u=>u.id===link.unit), building=db.buildings.find(b=>b.id===unit?.building);
    if(!person||!unit||!building||!person.portal||!person.correo)return;
    if(d.condo&&d.condo!=='all'&&building.condo!==d.condo)return;
    if(d.building&&d.building!=='all'&&unit.building!==d.building)return;
    const audience=d.destinatarios||'Todos los residentes autorizados';
    if(audience==='Propietarios'&&link.rol!=='Propietario')return;
    if(audience==='Inquilinos'&&link.rol!=='Inquilino')return;
    if(audience==='Responsables de pago'&&!activePayerAssignments(unit.id,targetDate).some(p=>p.person===person.id)&&!effectiveMaintenancePayers(unit.id,targetDate).some(p=>p.person===person.id))return;
    const key=`${person.id}|${unit.id}`;
    if(!result.some(x=>x.key===key))result.push({key,personId:person.id,person:person.nombre,email:person.correo,unit:unit.numero,unitId:unit.id,buildingId:building.id,building:building.nombre,condoId:building.condo,role:link.rol,status:'Disponible en el portal'});
  });
  return result;
};

function publishDueAnnouncements() {
  let changed=false;
  db.announcements.forEach(a=>{
    if(a.archivado||a.estado==='Borrador')return;
    const due=a.estado==='Programado'&&a.publicacion<=todayISO();
    const legacyPublished=(a.estado==='Publicado'||String(a.estado||'').startsWith('Publicado localmente'))&&!Array.isArray(a.deliveries);
    if(due||legacyPublished){
      a.estado='Publicado'; a.publicadoEn=a.publicadoEn||localStamp(); a.deliveries=recipientsForAnnouncement({...a,publicacion:due?a.publicacion:todayISO()}); a.total=a.deliveries.length; a.readReceipts=a.readReceipts||[];
      const emails=[...new Set(a.deliveries.map(d=>d.email).filter(Boolean))];
      emails.forEach(email=>{if(!(a.notifiedEmails||[]).includes(email))pushNotification(email,'Nuevo aviso: '+a.titulo,a.mensaje,'Aviso',a.id);});
      a.notifiedEmails=emails; changed=true; audit('Avisos',a.id,due?'Aviso publicado':'Destinatarios de aviso migrados',`${a.total} destinatarios`);
    }
  });
  if(changed)save();
}

// Destinatarios calculados con relaciones y asignaciones vigentes al publicar.
recipientsForAnnouncement = function(d) {
  const date = d.publicacion || todayISO(), condo = d.condo || 'all', buildingId = d.building || 'all';
  const audience = d.destinatarios || 'Todos los residentes autorizados';
  const byKey = new Map();
  const addRecipient = (person, unit, role) => {
    if (!person || !unit || !person.portal || !person.correo) return;
    const building = db.buildings.find(b => b.id === unit.building);
    if (!building) return;
    if (condo !== 'all' && building.condo !== condo) return;
    if (buildingId !== 'all' && building.id !== buildingId) return;
    const key = `${person.id}|${unit.id}`;
    if (!byKey.has(key)) byKey.set(key, { person: person.nombre, personId: person.id, email: person.correo, unit: unit.numero, unitId: unit.id, buildingId: building.id, building: building.nombre, condoId: building.condo, role, status: 'Visible en portal local' });
  };
  if (audience === 'Responsables de pago') {
    db.payers.filter(p => (!p.desde || p.desde <= date) && (!p.hasta || p.hasta >= date) && p.estado !== 'Inactivo').forEach(p => addRecipient(db.people.find(x => x.id === p.person), db.units.find(x => x.id === p.unit), 'Responsable de pago'));
  } else {
    db.links.filter(l => activeLink(l, date)).forEach(l => {
      const person = db.people.find(p => p.id === l.person), unit = db.units.find(u => u.id === l.unit);
      if (audience === 'Propietarios' && l.rol !== 'Propietario' && person?.tipo !== 'Propietario') return;
      if (audience === 'Inquilinos' && l.rol !== 'Inquilino' && person?.tipo !== 'Inquilino') return;
      addRecipient(person, unit, l.rol);
    });
  }
  return [...byKey.values()];
};

function openApplyCreditForm(creditId) {
  const credit=db.credits.find(c=>c.id===creditId); if(!credit)return;
  const invoices=db.invoices.filter(i=>{
    if(i.unit!==credit.unit||invoiceBalance(i)<=.009)return false;
    const responsible=i.payer||i.responsablePago||(i.contractId?db.contracts.find(c=>c.id===i.contractId)?.responsablePago:'');
    return responsible?responsible===credit.person:effectiveMaintenancePayers(i.unit,i.vence||i.fecha||todayISO()).some(p=>p.person===credit.person);
  });
  document.getElementById('overlay').innerHTML=`<div class="modalback" data-close><section class="modal"><div class="modalHead"><div><b>Aplicar crédito a una factura</b><small class="formhint">Crédito disponible: ${money(credit.remaining)}</small></div><button class="btn" data-close>×</button></div><form id="applyCreditForm" class="modalBody"><input type="hidden" name="creditId" value="${esc(credit.id)}"><label>Factura pendiente<select name="invoiceId" required><option value="">Selecciona una factura</option>${invoices.map(i=>`<option value="${esc(i.id)}">${esc(i.numero)} · ${esc(i.concepto)} · Saldo ${money(invoiceBalance(i))}</option>`).join('')}</select></label><label>Importe del crédito a aplicar (RD$)<input class="field" type="number" name="amount" min=".01" max="${Number(credit.remaining)}" step=".01" required value="${Number(credit.remaining).toFixed(2)}"></label><div class="notice">El crédito se registra como abono aplicado. No se crea un segundo movimiento bancario.</div><div class="modalFoot"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary">Aplicar crédito</button></div></form></section></div>`;
}
function saveApplyCreditForm(f) {
  const d=Object.fromEntries(new FormData(f)),credit=db.credits.find(c=>c.id===d.creditId),inv=db.invoices.find(i=>i.id===d.invoiceId),amount=roundMoney(Number(d.amount));
  if(!credit||!inv||inv.unit!==credit.unit){notify('No se encontró el crédito o la factura seleccionada.');return;}
  const designated=inv.payer||inv.responsablePago||(inv.contractId?db.contracts.find(c=>c.id===inv.contractId)?.responsablePago:'');
  const payerAllowed=designated?designated===credit.person:effectiveMaintenancePayers(inv.unit,inv.vence||inv.fecha||todayISO()).some(p=>p.person===credit.person);
  if(!payerAllowed){notify('El crédito y la factura no pertenecen al mismo responsable de pago.');return;}
  if(!(amount>0)||amount>Number(credit.remaining)+.009||amount>invoiceBalance(inv)+.009){notify('El importe debe ser mayor que cero y no superar el crédito ni el saldo de la factura.');return;}
  inv.paidAmount=roundMoney(invoicePaid(inv)+amount);updateInvoiceStatus(inv);credit.remaining=roundMoney(Number(credit.remaining)-amount);
  db.paymentEntries.unshift({id:id(),creditId:credit.id,invoiceId:inv.id,unit:inv.unit,person:credit.person,amount,reference:credit.reference||'Crédito a favor',date:todayISO(),registeredAt:localStamp(),source:'Crédito aplicado'});
  if(credit.remaining<=.009)credit.remaining=0;
  const q=db.installments.find(x=>x.invoiceId===inv.id);if(q)q.status=invoiceBalance(inv)<=.009?'Pagada':invoicePaid(inv)>.009?'Parcial':'Facturada';
  audit('Créditos',credit.id,'Crédito aplicado',`${money(amount)} a ${inv.numero}`);save();document.getElementById('overlay').innerHTML='';page='contractbilling';render();notify('Crédito aplicado correctamente a la factura.');
}

function saveMaintenanceForm(f){
  const d=Object.fromEntries(new FormData(f)),old=f.dataset.recordId?db.maintenance.find(x=>x.id===f.dataset.recordId):null;
  const b=db.buildings.find(x=>x.id===d.building),u=db.units.find(x=>x.id===d.unitId),staff=db.staff.find(x=>x.id===d.staffId),ticket=db.tickets.find(x=>x.id===d.ticketId),activity=db.activities.find(x=>x.id===d.activityId);
  if(!d.asunto?.trim()){notify('Indica el asunto de la orden.');return;}
  if(d.building&&(!b||(d.condo&&b.condo!==d.condo))){notify('La torre no pertenece al condominio seleccionado.');return;}
  if(d.unitId&&(!u||u.building!==d.building)){notify('El apartamento no pertenece a la torre seleccionada.');return;}
  if(d.ticketId&&!ticket){notify('Selecciona una solicitud válida.');return;}
  if(d.activityId&&!activity){notify('Selecciona una actividad válida.');return;}
  if(ticket&&ticket.maintenanceId&&ticket.maintenanceId!==old?.id){notify('Esta solicitud ya tiene una orden de mantenimiento vinculada. Abre esa orden para actualizarla.');return;}
  if(activity&&activity.maintenanceId&&activity.maintenanceId!==old?.id){notify('Esta actividad ya está vinculada a otra orden. Libera ese vínculo antes de continuar.');return;}
  if(ticket&&ticket.unitId&&(ticket.unitId!==(d.unitId||''))){notify('La orden y la solicitud deben corresponder al mismo apartamento o ambas a un área común.');return;}
  if(activity&&activity.unit&&(d.unitId||'')!==activity.unit){notify('La orden y la actividad deben corresponder al mismo apartamento.');return;}
  if(activity&&activity.building&&d.building&&activity.building!==d.building){notify('La orden y la actividad deben pertenecer a la misma torre.');return;}
  if(d.staffId&&!staff){notify('Selecciona un responsable activo válido.');return;}
  if(old&&old.ticketId&&old.ticketId!==d.ticketId){const prevTicket=db.tickets.find(t=>t.id===old.ticketId);if(prevTicket&&prevTicket.maintenanceId===old.id){prevTicket.maintenanceId='';prevTicket.status='Abierta';prevTicket.historial=prevTicket.historial||[];prevTicket.historial.push({fecha:localStamp(),accion:'Orden desvinculada',detalle:old.ref});}}
  if(old&&old.activityId&&old.activityId!==d.activityId){const prevActivity=db.activities.find(a=>a.id===old.activityId);if(prevActivity&&prevActivity.maintenanceId===old.id){prevActivity.maintenanceId='';prevActivity.estado='Pendiente';prevActivity.done=false;prevActivity.historial=prevActivity.historial||[];prevActivity.historial.push({fecha:localStamp(),accion:'Orden desvinculada',detalle:old.ref});}}
  const x={...old,...d,id:old?.id||id(),ref:old?.ref||'OT-'+Date.now().toString().slice(-7),unitId:d.unitId||'',unidad_area:u?.numero||'Área común',responsable:staff?.nombre||'',estado:d.estado||'Pendiente',historial:[...(old?.historial||[])]};
  x.historial.push({fecha:localStamp(),accion:old?'Orden actualizada':'Orden creada',detalle:x.estado,responsable:x.responsable});
  if(old)db.maintenance[db.maintenance.findIndex(z=>z.id===old.id)]=x;else db.maintenance.unshift(x);
  if(ticket){ticket.maintenanceId=x.id;x.ticketId=ticket.id;ticket.status=(x.estado==='Pendiente'&&ticket.status==='En revisión')?'En revisión':maintenanceToTicketStatus(x.estado);ticket.historial=ticket.historial||[];ticket.historial.push({fecha:localStamp(),accion:'Orden vinculada / actualizada',detalle:x.ref+' · '+ticket.status});if(ticket.email)pushNotification(ticket.email,'Actualización de mantenimiento '+x.ref,`La orden ${x.ref} está: ${x.estado}.`,'Mantenimiento');}
  if(activity){activity.maintenanceId=x.id;x.activityId=activity.id;activity.estado=maintenanceToActivityStatus(x.estado);activity.done=activity.estado==='Completada';activity.staffId=d.staffId||activity.staffId;activity.responsable=staff?.nombre||activity.responsable;activity.historial=activity.historial||[];activity.historial.push({fecha:localStamp(),accion:'Orden sincronizada',estado:activity.estado});}
  syncMaintenanceRelations(x);audit('Mantenimiento',x.id,old?'Orden actualizada':'Orden creada',x.asunto);save();document.getElementById('overlay').innerHTML='';page='maintenance';render();notify('Orden de trabajo guardada y relaciones sincronizadas.');
}
function maintenanceToActivityStatus(state){return state==='Completado'?'Completada':state==='Cancelado'?'Cancelada':state==='En progreso'?'En progreso':'Pendiente';}
function maintenanceToTicketStatus(state){return state==='Completado'?'Resuelta':state==='Cancelado'?'Cerrada':state==='En progreso'?'En progreso':'Abierta';}
function ticketToMaintenanceStatus(state){return state==='Resuelta'?'Completado':state==='Cerrada'?'Cancelado':state==='En progreso'?'En progreso':'Pendiente';}
function syncMaintenanceRelations(m) {
  const activityStateValue=maintenanceToActivityStatus(m.estado); let ticketStateValue=maintenanceToTicketStatus(m.estado);
  const a=db.activities.find(x=>x.maintenanceId===m.id||x.id===m.activityId);
  if(a&&activityState(a)!==activityStateValue){a.estado=activityStateValue;a.done=activityStateValue==='Completada';a.historial=a.historial||[];a.historial.push({fecha:localStamp(),accion:'Estado sincronizado desde orden',estado:activityStateValue});}
  const t=db.tickets.find(x=>x.id===m.ticketId||x.maintenanceId===m.id);
  if(t&&m.estado==='Pendiente'&&t.status==='En revisión')ticketStateValue='En revisión';
  if(t&&t.status!==ticketStateValue){t.status=ticketStateValue;t.historial=t.historial||[];t.historial.push({fecha:localStamp(),accion:'Solicitud actualizada desde orden',detalle:t.status});}

   const addClick=target.closest('[data-act="add"]');if(addClick&&(page==='activities'||page==='announcements'||page==='billing'||page==='staff')){e.preventDefault();e.stopImmediatePropagation();if(page==='activities')openActivityForm();else if(page==='announcements')openAnnouncementComposer();else if(page==='billing')generateBillingForPeriod(document.getElementById('billingPeriod')?.value||todayISO().slice(0,7));else openStaffForm();return;}
 },true);
// Cambios dependientes y estados auditados
 document.addEventListener('change', e=>{
   if(e.target.id==='maintenanceCondo'||e.target.id==='maintenanceBuilding'){filterMaintenanceScope();return;}
   if(e.target.id==='announcementCondo'){const sel=document.getElementById('announcementBuilding');if(sel){[...sel.options].forEach(o=>{if(!o.value)return;o.hidden=e.target.value!=='all'&&o.dataset.condo!==e.target.value;});if(sel.selectedOptions[0]?.hidden)sel.value='all';}return;}
   if(e.target.id==='activityCondo'||e.target.id==='activityBuilding'){filterActivityBuildings();return;}
   if(e.target.id==='documentCondo'||e.target.id==='documentBuilding'){filterDocumentScope();return;}
   if(e.target.dataset.activityStatus){const a=db.activities.find(x=>x.id===e.target.dataset.activityStatus);if(a){a.estado=e.target.value;a.done=a.estado==='Completada';a.historial=a.historial||[];a.historial.push({fecha:localStamp(),accion:'Cambio de estado',estado:a.estado,responsable:db.staff.find(s=>s.id===a.staffId)?.nombre||''});const m=db.maintenance.find(x=>x.id===a.maintenanceId);if(m){m.estado=a.estado==='Completada'?'Completado':a.estado==='Cancelada'?'Cancelado':a.estado==='En progreso'?'En progreso':'Pendiente';m.historial=m.historial||[];m.historial.push({fecha:localStamp(),accion:'Estado sincronizado desde actividad',detalle:m.estado});syncMaintenanceRelations(m);}audit('Actividades',a.id,'Estado actualizado',a.estado);save();render();notify('Estado de actividad y orden vinculada actualizado.');}return;}
   if(e.target.dataset.maintState){const m=db.maintenance.find(x=>x.id===e.target.dataset.maintState);if(m){m.estado=e.target.value;m.historial=m.historial||[];m.historial.push({fecha:localStamp(),accion:'Estado de orden actualizado',detalle:m.estado});syncMaintenanceRelations(m);const relatedTicket=db.tickets.find(t=>t.id===m.ticketId||t.maintenanceId===m.id);if(relatedTicket?.email)pushNotification(relatedTicket.email,'Actualización de mantenimiento '+m.ref,`La orden ${m.ref} ahora está: ${m.estado}.`,'Mantenimiento');audit('Mantenimiento',m.id,'Estado actualizado',m.estado);save();render();notify('Orden y registros vinculados actualizados.');}return;}
   if(e.target.dataset.ticketAssignee){const t=db.tickets.find(x=>x.id===e.target.dataset.ticketAssignee),staff=db.staff.find(x=>x.id===e.target.value);if(t){t.staffId=staff?.id||'';t.responsable=staff?.nombre||'';t.historial=t.historial||[];t.historial.push({fecha:localStamp(),accion:'Responsable asignado',detalle:t.responsable||'Sin asignar'});if(t.email)pushNotification(t.email,'Responsable asignado a tu solicitud',t.responsable?`Tu solicitud ${t.referencia} está asignada a ${t.responsable}.`:'La asignación de responsable fue retirada.','Solicitud');audit('Solicitudes',t.id,'Responsable asignado',t.responsable);save();notify('Responsable de la solicitud actualizado.');}return;}
   if(e.target.dataset.ticketState){const t=db.tickets.find(x=>x.id===e.target.dataset.ticketState);if(t){t.status=e.target.value;t.historial=t.historial||[];t.historial.push({fecha:localStamp(),accion:'Estado actualizado',detalle:t.status});const m=db.maintenance.find(x=>x.id===t.maintenanceId||x.ticketId===t.id);if(m){m.estado=ticketToMaintenanceStatus(t.status);m.historial=m.historial||[];m.historial.push({fecha:localStamp(),accion:'Estado sincronizado desde solicitud',detalle:m.estado});syncMaintenanceRelations(m);}if(t.email)pushNotification(t.email,'Actualización de solicitud '+t.referencia,`El estado de tu solicitud ahora es: ${t.status}.`,'Solicitud');audit('Solicitudes',t.id,'Estado actualizado',t.status);save();render();}return;}
   if(e.target.id==='depositUnit'||e.target.matches('#portalDeposit [name="facturaIds"]'))refreshPortalPaymentTotal();
 },true);

// 13. Reemplazar el cálculo de selección para permitir abonos parciales
refreshPortalPaymentTotal = function() {
  const f=document.getElementById('portalDeposit');if(!f)return;const unit=f.elements.unidad?.value||'';let sum=0,count=0;
  f.querySelectorAll('[data-pay-invoice]').forEach(card=>{const show=!unit||card.dataset.unit===unit;card.hidden=!show;const cb=card.querySelector('input[type=checkbox]');if(!show&&cb)cb.checked=false;if(show&&cb?.checked){sum+=Number(cb.dataset.balance||0);count++;}});
  const amount=f.querySelector('#paymentTotal');if(amount){amount.dataset.maxSelected=String(roundMoney(sum));if(!amount.dataset.userChanged)amount.value=count?roundMoney(sum).toFixed(2):'';amount.removeAttribute('max');}
  const note=f.querySelector('#paySelectedCount');if(note)note.textContent=`${count} factura(s) seleccionada(s) · Saldo seleccionado ${money(sum)}. Puedes reportar un abono parcial.`;
};
document.addEventListener('input',e=>{if(e.target.id==='paymentTotal')e.target.dataset.userChanged='1';},true);
// Capturar submit de depósito para permitir parcial y crédito, reemplazando el antiguo validador
 document.addEventListener('submit',e=>{
   const f=e.target;if(f.id!=='portalDeposit')return;e.preventDefault();e.stopImmediatePropagation();
   const fd=new FormData(f),d=Object.fromEntries(fd),invoiceIds=[...new Set(fd.getAll('facturaIds'))],file=f.elements.comprobante?.files?.[0],unit=db.units.find(u=>u.id===d.unidad),person=db.people.find(p=>(p.correo||'').toLowerCase()===String(db.user||'').toLowerCase());
   if(!file){notify('Adjunta el comprobante.');return;} if(file.size>5*1024*1024){notify('El comprobante no puede superar 5 MB.');return;}
   if(!person||!unit||!invoiceIds.length){notify('Selecciona la unidad y al menos una factura.');return;}
   if(!db.links.some(l=>l.person===person.id&&l.unit===unit.id&&activeLink(l))){notify('La unidad seleccionada no está vinculada a tu cuenta.');return;}
   const invs=invoiceIds.map(fid=>db.invoices.find(i=>i.id===fid));if(invs.some(i=>!i||i.unit!==unit.id||!invoiceVisibleToResident(i,person.id,[unit.id])||invoiceBalance(i)<=.009)){notify('Hay facturas que no te corresponden o ya no tienen saldo.');return;}
   if(db.deposits.some(x=>String(x.referencia||'').trim().toLowerCase()===String(d.referencia||'').trim().toLowerCase()&&x.status!=='Rechazado')){notify('La referencia bancaria ya fue reportada y no está rechazada.');return;}
   if(invs.some(i=>db.deposits.some(x=>(x.invoiceIds||[x.facturaId]).includes(i.id)&&['Reportado','Pendiente de verificación bancaria'].includes(x.status)))){notify('Una de las facturas ya tiene un depósito pendiente de revisión.');return;}
   const max=roundMoney(invs.reduce((s,i)=>s+invoiceBalance(i),0)),amount=roundMoney(Number(d.monto));if(!(amount>0)){notify('El importe debe ser mayor que cero.');return;}
   attachmentData(file).then(att=>{const building=db.buildings.find(b=>b.id===unit.building),deposit={...d,id:id(),unit:unit.id,unidad:unit.numero,edificio:building?.nombre||'',person:person.correo,personId:person.id,status:'Reportado',facturaId:invoiceIds[0],invoiceIds,invoices:invs.map(i=>({id:i.id,numero:i.numero,concepto:i.concepto})),monto:amount,comprobante:att.data,comprobanteNombre:att.name,fechaReporte:localStamp()};db.deposits.unshift(deposit);pushNotification('administracion','Nuevo depósito reportado',`${person.nombre} reportó ${money(amount)} para ${unit.numero}.`,'Pago');audit('Depósitos',deposit.id,'Depósito reportado',`${money(amount)} · ${unit.numero}`);save();page='portaldeposit';render();notify('Depósito enviado. La administración debe revisar y conciliar el movimiento.');}).catch(err=>notify(err.message));
 },true);

// 14. Enlaces de módulos adicionales, compatibilidad y automatizaciones
const extraViews={staff:staffPage};
const originalRender=render;
render=function(){
  // Actualiza estados de facturas sin sobrescribir un pago parcial.
  let changed=false;
  db.invoices.forEach(i=>{const before=i.status;updateInvoiceStatus(i);if(i.status!==before)changed=true;});
  publishDueAnnouncements();
  issueDueContractInvoices();
  if(changed)save();
  originalRender();
};
// Asegurar que el menú incluya personal y notificaciones una sola vez
if(!sections.some(s=>s[1].some(item=>item[0]==='staff')))sections.splice(sections.length-1,0,['PERSONAL Y RECURSOS',[['staff','♙','Personal administrativo']]]);
// Navegación y formularios de personal/actividad desde los botones heredados

// No marcar automáticamente todas las notificaciones como leídas por entrar al módulo.
// Se conserva el estado individual para que el residente pueda distinguir novedades.

// El prototipo local revisa avisos programados mientras permanece abierto.
// No funciona como servicio de fondo cuando se cierra el navegador.
if (typeof window !== 'undefined' && !window.__kabayAnnouncementTimer) {
  window.__kabayAnnouncementTimer = window.setInterval(() => {
    const before = db.announcements.map(a => `${a.id}:${a.estado}`).join('|');
    publishDueAnnouncements();
    const after = db.announcements.map(a => `${a.id}:${a.estado}`).join('|');
    if (before !== after) render();
  }, 60000);
}

render();
})();
